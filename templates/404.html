<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeCatcher - Page Not Found</title>
  <link rel="icon" href="../static/favicon.svg" type="image/svg+xml" sizes="any">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/styles.css">
</head>

<body>
  <header class="site-header">
    <h1><img src="../static/logo.svg" alt="FakeCatcher Logo" class="logo-icon">FakeCatcher</h1>
  </header>

  <div class="content-container">
    <div class="result-box mt-4">
      <h2 class="text-center mb-3">Page Not Found</h2>
      <div class="text-center mt-4">
        <p>The page you are looking for does not exist.</p>
        <p>{{ error }}</p>
      </div>
      <div class="button-container mt-3 text-center">
        <button class="custom-btn primary-btn" type="button" onclick="window.location.href='/'">Go Home</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
