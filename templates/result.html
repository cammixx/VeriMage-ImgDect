<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeCatcher - Analysis Result</title>
  <link rel="icon" href="../static/favicon.svg" type="image/svg+xml" sizes="any">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
  <header class="site-header">
    <h1><img src="../static/logo.svg" alt="FakeCatcher Logo" class="logo-icon">FakeCatcher</h1>
  </header>

  <div class="content-container">
    <div class="result-box mt-4" id="resultContainer">
      <h2 class="text-center mb-3">Analysis Result</h2>
     
      <div class="row justify-content-center mt-4">
        <div class="col-md-6">
          <div id="thumbnailContainer" class="preview-container text-center">
            <img id="userImage" class="preview-thumbnail" src="" alt="Uploaded Image">
          </div>
        </div>
      </div>
      <p class="text-center" id="introText">Compare with our data, we say this image is...</p>
      <p id="resultText" class="h5 text-center mt-3"></p>
    </div>
    <div class="text-center mt-3">
<!-- Grad-CAM container is dynamically inserted here by JS -->

<!-- Add this slider container below (or at the end of your main content div) -->
<div id="sliderContainer" class="text-center mt-3" style="display: none;">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <label for="alphaSlider" class="form-label">Adjust Heatmap Transparency</label>
        <input type="range" class="form-range" id="alphaSlider" min="0.1" max="0.9" step="0.1" value="0.5">
        <div class="d-flex justify-content-between">
          <small>More Original</small>
          <small>More Heatmap</small>
        </div>
      </div>
    </div>
  </div>
  
    <!-- Add this above the Go Back button -->
<div class="text-center mt-3">
  <button id="findMoreBtn" class="btn btn-secondary mb-2">Find More</button>
  <a href="/" class="btn btn-primary">Go Back</a>

    </div>

  </div>

  <script src="../static/script.js"></script>
</body>
</html>
