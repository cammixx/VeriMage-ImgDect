<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Image Detection</title>
    <link rel="stylesheet" href="../static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center">
        <h2 class="mb-4">Fraud Image Detection</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <div class="mb-3">
                <input class="form-control" type="file" id="image-upload" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload & Check</button>
        </form>
        <img id="image-preview" class="image-preview" alt="Uploaded Image Preview">
        <div id="result" class="mt-3"></div>
    </div>

    <script src="../static/script.js"></script>
</body>
</html>
