<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SusScan | AI Lies. We Detect. </title>
  <link rel="icon" href="../static/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/styles.css">
</head>

<body>
  <header class="site-header">
    <h1><img src="../static/logo.svg" alt="FakeCatcher Logo" class="logo-icon">SusScan</h1>
    <p class="tagline">— "AI Lies. We Detect."</p>
  </header>

  <div class="content-container">
    <div class="upload-container">
      <h2 class="text-center mb-4">Upload Image Here</h2>
      <!-- Upload Form -->
      <form id="uploadForm" enctype="multipart/form-data" method="POST">
        <div class="row equal-height-container">
          <!-- Left Column: Upload Zone -->
          <div class="col-md-6">
            <div class="upload-area" id="uploadBox">
              <p>Click to upload an image</p>
              <small class="upload-info">
                Supported formats: JPEG, PNG.<br>
                Max file size: 16MB.</small>
              <input type="file" id="imageInput" name="image" accept="image/*" hidden>
            </div>
          </div>
          <!-- Right Column: Preview Zone -->
          <div class="col-md-6">
            <div id="thumbnailContainer" class="preview-container text-center">
              <p id="previewPlaceholder">Image Preview</p>
              <img id="imagePreview" class="preview-thumbnail" onclick="openFullSizeImage()" style="display: none;">
            </div>
          </div>
        </div>
        <!-- Submit Button -->
        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-primary btn-lg">Click to Analyze</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading overlay for analysis animation -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
      <div class="spinner-grow" role="status">
        <span class="visually-hidden">Processing...</span>
      </div>
      <div class="percentage-text">0%</div>
    </div>
  </div>

  <!-- Image Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Full Size Preview</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img id="fullSizePreview" class="img-fluid">
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/script.js"></script>
</body>

</html>
